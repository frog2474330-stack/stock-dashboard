  <span class="sm"><b>回測：</b>${esc((D.卡片[0]||{}).多空成績||'未經回測')}</span><br>${D.樣本外?'<span class="sm">'+esc(D.樣本外)+'</span><br>':''}<span class="mut sm">更新：${esc(D.產生時間)}。型態：${esc(D.型態備註)}。${D.失敗&&D.失敗.length?'<span class="stale">這次沒更新：'+esc(D.失敗.join('、'))+'</span>':''}</span>`;
}
function head(c){
  const st=stale(c.資料日);
  return `<div class="hd"><span class="nm">${esc(c.名稱)}<span class="badge2">${esc(c.區)}</span></span>
   <span class="px">${num(c.收盤)} ${pc(c['漲跌%'])}</span></div>
   <div class="sm mut">資料日 ${fd(c.資料日)}${st?' <span class="stale">（資料可能沒更新）</span>':''}${c.合約?'　合約 '+esc(c.合約):''}</div>
   <div style="margin-top:6px"><span class="side ${esc(c.多空)}">${esc(c.多空)}</span><span class="sm">${esc(c.多空說明)}</span></div>
   <div class="sm mut">${esc(c.本市場成績||'')}</div>
   <div class="mrow"><span>年度區間 ${c.位階.年度區間位置==null?'—':Math.round(c.位階.年度區間位置*100)+'%'}</span>
   <span>距20日線 ${pc(c.位階['距20日線%'])}</span><span>距60日線 ${pc(c.位階['距60日線%'])}</span><span>距120日線 ${pc(c.位階['距120日線%'])}</span></div>
   <div class="mrow"><span>道氏 主要（週K）：<b>${esc(c.道氏['主要（週K）'])}</b></span><span>次要（日K）：${esc(c.道氏['次要（日K）'])}</span></div>
   <div class="mrow"><span>型態：${c.候選型態.length?c.候選型態.map(x=>`${esc(x.型態)}（${esc(x.狀態)}）`).join('、'):'沒有'}</span></div>`;
}
function cand(x){
  const lv=Object.entries(x.價位||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${num(v.價)}</td><td>${pc(v['距現價%'])}</td></tr>`).join('');
  const rs=(x.規則明細||[]).map(r=>`<tr><td>${esc(r.規則)}</td><td>${esc(r.實際??'—')}</td><td>${esc(r.門檻??'')}</td><td>${r.通過==='是'?'✅':r.通過==='否'?'❌':esc(r.通過)}</td></tr>`).join('');
  return `<div class="cand"><span class="t">${esc(x.型態)}</span>（${x.方向==='多'?'<span class="up">多</span>':'<span class="dn">空</span>'}・${esc(x.狀態)}）
   符合度 <b>${esc(x.符合度)}</b>${x.突破日?'　突破日 '+esc(x.突破日):''}　距參考線 ${pc(x['距參考線%'])}
   <div class="sm mut">${esc(x.備註)}${x.量?'；'+esc(x.量):''}</div>
   ${lv?`<table class="lv">${lv}</table>`:''}
   <details><summary class="sm">規則檢查表（符合度＝規則過了幾條，不是上漲機率）</summary><div class="scroll"><table class="lv"><tr><th>規則</th><th>實際</th><th>門檻</th><th>通過</th></tr>${rs}</table></div></details></div>`;
}
function detail(c,i){
  const kv=Object.entries(c.關鍵價位).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v==='沒有'?'沒有':num(v.價)}</td><td>${v==='沒有'?'':pc(v['距現價%'])}</td></tr>`).join('');
  const n=rngN[i]||120;
  return `<div class="det"><div class="rng"><button data-i="${i}" data-n="120" class="${n===120?'on':''}">120 日</button><button data-i="${i}" data-n="250" class="${n===250?'on':''}">1 年</button></div>
   <div class="chartbox" id="cb${i}"></div>
   <h3>候選型態</h3>${c.候選型態.length?c.候選型態.map(cand).join(''):'<div class="mut">目前沒有成立、形成中或接近成立的型態</div>'}
   ${c.其他候選&&c.其他候選.length?`<div class="sm mut">其他：${esc(c.其他候選.join('、'))}</div>`:''}
   ${c.最近結束&&c.最近結束.length?`<div class="sm">最近 10 日結束：${c.最近結束.map(r=>`${esc(r.型態)}${esc(r.狀態)}${r.失敗原因?'（'+esc(r.失敗原因)+'）':''}`).join('、')}</div>`:''}
   <h3>關鍵價位</h3><table class="lv"><tr><th></th><th>價位</th><th>距現價</th></tr>${kv}</table>
   <div class="sm mut" style="margin-top:6px">量：${esc(c.量)}<br>來源：${esc(c.來源)}；對答案：${esc(c.對照)}${c.來源備註?'<br>'+esc(c.來源備註):''}${c.換月說明?'<br>'+esc(c.換月說明):''}</div></div>`;
}
function render(){
  $('grid').innerHTML=D.卡片.map((c,i)=>`<article class="mk${open[i]?' open':''}" id="mk${i}">${head(c)}
    <button class="more" data-i="${i}">${open[i]?'收起':'展開：K 線圖、型態、價位'}</button>${open[i]?detail(c,i):''}</article>`).join('');
  D.卡片.forEach((c,i)=>{if(open[i])drawK($('cb'+i),c.圖,rngN[i]||120)});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  const i=+b.dataset.i;
  if(b.classList.contains('more')){open[i]=!open[i];render();if(open[i])$('mk'+i).scrollIntoView({block:'nearest'})}
  else if(b.dataset.n){rngN[i]=+b.dataset.n;render()}
});
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const f=r/p;return (f<1.5?1:f<3?2:f<7?5:10)*p}
// 右側價位標籤：依高度排好，兩個距離不到 minGap 就往下推；超出圖底再整串往上推
function spread(items,minGap,top,bot){
  items.sort((a,b)=>a.y-b.y); items.forEach(it=>it.ly=Math.max(top,it.y));
  for(let k=1;k<items.length;k++)if(items[k].ly<items[k-1].ly+minGap)items[k].ly=items[k-1].ly+minGap;
  const n=items.length; if(n&&items[n-1].ly>bot){items[n-1].ly=bot;for(let k=n-2;k>=0;k--)if(items[k].ly>items[k+1].ly-minGap)items[k].ly=items[k+1].ly-minGap}
  return items;
}
function drawK(box,g,nShow){
  if(!box||!g)return;
  const N=g.日期.length,s=Math.max(0,N-nShow),n=N-s, hasV=g.量.slice(s).some(v=>v!=null);
  const W=Math.max(300,box.clientWidth||600),R=60,PH=Math.round(Math.min(360,Math.max(220,W*0.5))),VH=hasV?Math.round(PH*0.25):0,GAP=hasV?14:0,TOP=8,H=TOP+PH+GAP+VH+22;
  const cw=(W-R-4)/n,X=i=>4+(i-s+0.5)*cw;
  let lo=Infinity,hi=-Infinity;for(let i=s;i<N;i++){if(g.低[i]!=null)lo=Math.min(lo,g.低[i]);if(g.高[i]!=null)hi=Math.max(hi,g.高[i])}
  const lo0=lo,hi0=hi,lv=(g.價位||[]).filter(l=>l.價!=null&&l.價>=lo0*0.85&&l.價<=hi0*1.15);
  lv.forEach(l=>{lo=Math.min(lo,l.價);hi=Math.max(hi,l.價)});
  const pad=(hi-lo)*0.04||1;lo-=pad;hi+=pad;const Y=p=>TOP+(hi-p)/(hi-lo)*PH;
  const css=getComputedStyle(document.documentElement),col=k=>css.getPropertyValue(k).trim(),up=col('--up'),dn=col('--down');
  let o=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Consolas,monospace" font-size="11">`;
  const step=niceStep((hi-lo)/5);
  for(let p=Math.ceil(lo/step)*step;p<=hi;p+=step){const y=Y(p);o+=`<line x1="0" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${W-R+4}" y="${y+4}" fill="var(--muted)">${num(p)}</text>`}
  const ds=Math.max(1,Math.round(n/(W<500?4:7)));
  for(let i=s;i<N;i+=ds)o+=`<text x="${X(i)}" y="${H-5}" fill="var(--muted)" text-anchor="middle">${g.日期[i].slice(2,4)}/${g.日期[i].slice(4,6)}/${g.日期[i].slice(6)}</text>`;
  const bw=Math.max(1,cw*0.64);let vmax=0;for(let i=s;i<N;i++)vmax=Math.max(vmax,g.量[i]||0);
  const VB=TOP+PH+GAP+VH,VY=v=>VB-(v/(vmax||1))*VH;
  for(let i=s;i<N;i++){const O=g.開[i],Hh=g.高[i],L=g.低[i],C=g.收[i];if(C==null)continue;
    const cc=C>=O?up:dn,x=X(i),y1=Y(Math.max(O,C)),y2=Y(Math.min(O,C));
    o+=`<line x1="${x}" x2="${x}" y1="${Y(Hh)}" y2="${Y(L)}" stroke="${cc}"/><rect x="${x-bw/2}" y="${y1}" width="${bw}" height="${Math.max(1,y2-y1)}" fill="${cc}"/>`;
    if(hasV&&g.量[i]!=null)o+=`<rect x="${x-bw/2}" y="${VY(g.量[i])}" width="${bw}" height="${VB-VY(g.量[i])}" fill="var(--vol)"/>`;}
  const leg=[];
  [['MA20','var(--c0)'],['MA60','var(--vma)'],['MA120','var(--c1)']].forEach(([k,c])=>{let p='';for(let i=s;i<N;i++){const v=g[k][i];if(v==null)continue;p+=(p?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)}
    if(p){o+=`<path d="${p}" fill="none" stroke="${c}" stroke-width="1.3"/>`;leg.push(`<span style="color:${c}">━ ${k.replace('MA','')}日線</span>`)}});
  if(hasV)o+=`<text x="4" y="${TOP+PH+GAP+10}" fill="var(--muted)">成交量</text>`;
  else o+=`<text x="4" y="${TOP+PH-4}" fill="var(--muted)">量：無資料</text>`;
  const items=lv.map(l=>({y:Y(l.價),l}));spread(items,15,TOP+7,TOP+PH-7);
  items.forEach(it=>{const l=it.l,c=/支撐/.test(l.名稱)?dn:/壓力/.test(l.名稱)?up:/停損/.test(l.名稱)?col('--ink'):/60日線/.test(l.名稱)?col('--vma'):col('--c2');
    o+=`<line x1="0" x2="${W-R-6}" y1="${it.y}" y2="${it.y}" stroke="${c}" stroke-dasharray="5 3" stroke-width="1"/>`;
    o+=`<path d="M${W-R-6} ${it.y}L${W-R} ${it.ly}" stroke="${c}" fill="none"/><rect x="${W-R}" y="${it.ly-7.5}" width="${R-1}" height="15" rx="3" fill="${c}"/><text x="${W-R+3}" y="${it.ly+4}" fill="var(--bg)">${num(l.價)}</text>`;
    leg.push(`<span style="color:${c}">┅ ${esc(l.名稱)} ${num(l.價)}</span>`)});
  o+='</svg>';
  box.innerHTML=o+`<div class="sm" style="display:flex;flex-wrap:wrap;gap:2px 12px">${leg.join('')}</div>`;
}
rules();render();
addEventListener('resize',()=>{clearTimeout(window.__t);window.__t=setTimeout(render,200)});
</script></body></html>
